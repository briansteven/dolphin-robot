name: Release

# Publishes a GitHub release, with that version's CHANGELOG.md section as the
# notes. HACS installs from these releases. It runs on:
# - a push to main: releases the version in manifest.json, if not yet released
#   (bump the version in a PR and merging it publishes the release)
# - a pushed version tag (e.g. v1.0.26.1)
# Beta versions (v1.0.26b3) become prereleases.

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# one run at a time, so a second run sees the first one's release and skips
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(jq -r .version custom_components/mydolphin_plus/manifest.json)
            case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notes from CHANGELOG.md
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="## ${TAG}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          args=(--title "$TAG" --notes-file notes.md)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          # beta versions such as v1.0.26b3 are published as prereleases
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
