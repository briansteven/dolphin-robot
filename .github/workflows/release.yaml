name: Release

# Pushing a version tag (e.g. v1.0.26.1) publishes a GitHub release for it,
# with that version's CHANGELOG.md section as the notes. HACS installs from
# these releases.

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
