name: Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install homeassistant pytest pytest-asyncio awsiotsdk flatten_json aiofiles
      # api_test.py and the other *_test.py files are manual scripts that need a real account
      - run: python -m pytest -q tests/test_rest_api_semantics.py tests/test_reauth_flow_semantics.py tests/test_vacuum_actions.py
