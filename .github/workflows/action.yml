name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Upstream (sh00t2kill/dolphin-robot) has no license file, so this fork
          # can't add one; HACS custom repositories install without it.
          ignore: "license"
